services:
  - type: web
    name: convertify
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MAX_UPLOAD_GB
        value: "0.1"   # 100 MB, the free plan is tiny
      - key: MAX_JOBS
        value: "1"
